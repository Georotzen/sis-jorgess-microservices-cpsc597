name: CI

on:
  push:
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"
  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
