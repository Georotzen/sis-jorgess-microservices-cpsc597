apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sis
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-sa
      containers:
      - name: gateway-1
        image: 9574/gateway:latest   # ← adjust to your actual image
        ports:
        - containerPort: 3000             # ← adjust if your gateway uses a different port
        env:
        - name: NODE_ENV
          value: "production"
