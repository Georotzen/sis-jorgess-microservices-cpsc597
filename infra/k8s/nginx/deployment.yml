apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: sis
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx-sa
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-certs
          mountPath: /etc/nginx/certs
    volumes:
    - name: nginx-conf
      configMap:
        name: nginx-conf
    - name: nginx-certs
      secret:
        secretName: nginx-certs
