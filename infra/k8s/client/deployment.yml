apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: sis
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client-sa
      containers:
      - name: client
        image: 9574/client:latest
        ports:
        - containerPort: 3000
