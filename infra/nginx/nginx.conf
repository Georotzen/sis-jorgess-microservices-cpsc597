user  nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
  access_log  /var/log/nginx/access.log  main;
  error_log   /var/log/nginx/error.log warn;

  sendfile   on;
  keepalive_timeout 65;

  # Don't leak the nginx version to clients/error pages.
  server_tokens off;

  # Coarse, IP-based edge rate limit. This is a BLUNT backstop, not a
  # substitute for the Gateway's ThrottlerGuard (services/gateway) —
  # Nginx doesn't know who's authenticated, so it can only protect
  # against raw floods, not per-user abuse. Its job is purely to keep
  # obvious DoS traffic from ever reaching NestJS/Keycloak.
  limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=20r/s;
  limit_req_status 429;

  # Bound request size/time. Matches the Gateway proxy's own 5s
  # timeout (services/gateway/src/proxy/proxy.controller.ts) so a slow
  # client can't hold a connection open longer than a slow backend can.
  client_max_body_size 5m;
  client_body_timeout 10s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 10s;
  proxy_send_timeout 10s;

  upstream gateway_upstream {
    # One line per Gateway replica. Today there's one; scaling the
    # Gateway horizontally later is just adding `server` lines here —
    # no application changes needed.
    server gateway:3000;
    keepalive 32;
  }

  upstream client_upstream {
    # Static Next.js client served by httpd in the client container.
    server client:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    limit_req zone=edge_limit burst=40 nodelay;

    # Perimeter security headers. CORS itself is deliberately NOT set
    # here — it stays owned by the Gateway (main.ts's app.enableCors),
    # since CORS needs to reason about credentials + CLIENT_ORIGIN, and
    # duplicating that in Nginx would create a second source of truth
    # for who's allowed to call the API from a browser.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/health {
      proxy_pass http://gateway_upstream;
      access_log off;
    }

    # Proxy service routes to Gateway first (explicit, highest priority)
    location ~ ^/(identity|student-profile|enrollment|grades|audit)/ {
      proxy_pass http://gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # Proxy all /api/* to the Gateway
    location /api/ {
      proxy_pass http://gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # Serve static client files (catch-all, lowest priority)
    location / {
      proxy_pass http://client:3000;
      proxy_pass http://client_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }

  # --- HTTPS / TLS termination ----------------------------------------
  # Off by default so `docker-compose up` works with zero setup in local
  # dev. To turn it on:
  #   1. Put a cert + key on disk and mount them into this container
  #      (e.g. add `- ../nginx/certs:/etc/nginx/certs:ro` under the
  #      nginx service's `volumes:` in infra/docker/docker-compose.yml).
  #      For local dev, a self-signed pair works:
  #        openssl req -x509 -nodes -newkey rsa:2048 \
  #          -keyout infra/nginx/certs/privkey.pem \
  #          -out infra/nginx/certs/fullchain.pem -days 365 \
  #          -subj "/CN=localhost"
  #   2. Uncomment the server block below.
  #   3. Uncomment the "443:443" port mapping on the nginx service in
  #      infra/docker/docker-compose.yml.
  #   4. Optionally, add `return 301 https://$host$request_uri;` inside
  #      the port-80 server block above to force HTTPS.
  #
   server {
     listen 443 ssl;
     server_name _;
     ssl_certificate     /etc/nginx/certs/dev.crt;
     ssl_certificate_key /etc/nginx/certs/dev.key;
     ssl_protocols TLSv1.2 TLSv1.3;
  
     limit_req zone=edge_limit burst=40 nodelay;
  
     add_header X-Content-Type-Options nosniff always;
     add_header X-Frame-Options DENY always;
     add_header Referrer-Policy strict-origin-when-cross-origin always;
  
     location /api/health {
       proxy_pass http://gateway_upstream;
       access_log off;
     }
  
     location ~ ^/(identity|student-profile|enrollment|grades|audit)/ {
       proxy_pass http://gateway_upstream;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header Connection "";
     }
  
     location /api/ {
       proxy_pass http://gateway_upstream;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header Connection "";
     }
  
     location / {
       proxy_pass http://client_upstream;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header Connection "";
     }
   }
}
