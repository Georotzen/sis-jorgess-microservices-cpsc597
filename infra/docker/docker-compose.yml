#version: "3.9"

networks:
  sis-net:

volumes:
  identity-db-data:
  student-profile-db-data:
  enrollment-db-data:
  grades-db-data:
  audit-db-data:
  redis-data:
  keycloak-db-data:

services:
  # ---------------------------------------------------------
  # Data Layer — One PostgreSQL instance per microservice
  # ---------------------------------------------------------

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: KcDb_28ffecfa7e4859d91c1b53ae67f6bc3c9e3283d955454109
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity_svc
      POSTGRES_PASSWORD: IdDb_71e4882576b7b7731d5647f259fb8338e592659c26884868
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  student-profile-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_profile
      POSTGRES_USER: student_profile_svc
      POSTGRES_PASSWORD: SpDb_0b4e2284c078e7ad78c895dd990eb6372596c9eb38855674
    volumes:
      - student-profile-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_profile_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  enrollment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enrollment
      POSTGRES_USER: enrollment_svc
      POSTGRES_PASSWORD: EnDb_bab86abc7354af98272ee63bfd9ff8f1313133621602e07f
    volumes:
      - enrollment-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  grades-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grades
      POSTGRES_USER: grades_svc
      POSTGRES_PASSWORD: GrDb_69cc702325befa9be9e0ec9e97cab7c0a2a81dfebd0f2db4
    volumes:
      - grades-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grades_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit_svc
      POSTGRES_PASSWORD: AuDb_fcf8fbc2403f37751c49bdeec20c3ef80b111caface96331
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks: [sis-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_svc"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [sis-net]
    restart: unless-stopped

  # ---------------------------------------------------------
  # Infrastructure Layer — Keycloak, RabbitMQ, Vault
  # ---------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: KcAdm_2a74e6736f23c7a22980e92ce5d55450d3e781d81f9cac7a
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: KcDb_28ffecfa7e4859d91c1b53ae67f6bc3c9e3283d955454109
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "9080:8080"
    networks: [sis-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [sis-net]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: changeme
    ports:
      - "8200:8200"
    networks: [sis-net]
    restart: unless-stopped

  # ---------------------------------------------------------
  # Application Layer — NestJS Microservices + Gateway
  # ---------------------------------------------------------

 # Nginx is now the only edge that publishes an HTTP(S) port to the
  # host. gateway/identity below intentionally lose their `ports:`
  # mappings — they're still reachable by name on sis-net (that's all
  # container-to-container traffic needs), they're just no longer
  # reachable directly from the host, bypassing Nginx and the Gateway's
  # own guards. If you need to hit the Gateway directly while debugging,
  # temporarily add back `ports: ["3000:3000"]` on `gateway`.
  #
  # Run infra/nginx/generate-dev-cert.sh once before first bringing
  # this up — see infra/nginx/README.md.
  #
  # Phase 5: Static Next.js client, built as pure static output (no runtime)
  client:
    build:
      context: ../../
      dockerfile: apps/client/Dockerfile
    expose:
      - "3000"
    networks: [sis-net]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
      client:
        condition: service_started
    ports:
      - "8888:80"
      - "8889:443"
    networks: [sis-net]
    restart: unless-stopped


  gateway:
    build:
      context: ../../
      dockerfile: services/gateway/Dockerfile
    env_file: ../../services/gateway/.env
    depends_on:
      keycloak:
        condition: service_started
    networks: [sis-net]
    restart: unless-stopped

  identity:
    build:
      context: ../../
      dockerfile: services/identity/Dockerfile
    env_file:
      - ../../infra/secrets/identity-service.env
      - ../../infra/secrets/identity-db.env
    environment:
      DATABASE_HOST: identity-db
#    environment:
#      DATABASE_HOST: identity-db
    ports:
      - "3001:3001"
    depends_on:
      identity-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks: [sis-net]
    restart: unless-stopped

  student-profile:
    build:
      context: ../../
      dockerfile: services/student-profile/Dockerfile
    env_file: ../../services/student-profile/.env    
#    environment:
#      DATABASE_HOST: student-profile-db
    depends_on:
      student-profile-db:
        condition: service_healthy
    networks: [sis-net]
    restart: unless-stopped

  enrollment:
    build:
      context: ../../
      dockerfile: services/enrollment/Dockerfile
    env_file: ../../services/enrollment/.env
#    environment:
#      DATABASE_HOST: enrollment-db
    depends_on:
      enrollment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks: [sis-net]
    restart: on-failure

  grades:
    build:
      context: ../../
      dockerfile: services/grades/Dockerfile
    env_file: ../../services/grades/.env
#    environment:
#      DATABASE_HOST: grades-db
    depends_on:
      grades-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks: [sis-net]
    restart: unless-stopped

  audit:
    build:
      context: ../../
      dockerfile: services/audit/Dockerfile
    env_file: ../../services/audit/.env
#    environment:
#      DATABASE_HOST: audit-db
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks: [sis-net]
    restart: unless-stopped
